<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Post Details</title>
</head>
<body>
    <h1 th:text="${post.title}">Post Title</h1>
    <p><strong>Author:</strong> <span th:text="${post.author.username}">Author Name</span></p>
    <p><strong>Created At:</strong> <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">Timestamp</span></p>
    <hr/>
    <div th:text="${post.content}">
        Post content goes here.
    </div>
    <hr/>

    <!-- Edit and Delete buttons for the author -->
    <div sec:authorize="isAuthenticated()" th:if="${#authentication.name == post.author.username}">
        <a th:href="@{/posts/{id}/edit(id=${post.id})}">Edit Post</a>
        <form th:action="@{/posts/{id}/delete(id=${post.id})}" method="post" style="display: inline;">
            <button type="submit" onclick="return confirm('Are you sure you want to delete this post?');">Delete Post</button>
        </form>
    </div>

    <a th:href="@{/posts}">Back to List</a>
</body>
</html>
