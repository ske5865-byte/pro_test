<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; color: #333; max-width: 500px; margin: 50px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #1E4E9C; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .error { color: red; font-size: 0.9em; }
        .success { color: green; font-size: 0.9em; }
    </style>
</head>
<body>
    <h1>Create Account</h1>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form id="registerForm" th:action="@{/register}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
            <div id="username-feedback" class="error"></div>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <div id="email-feedback" class="error"></div>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group">
            <label for="passwordConfirm">Confirm Password</label>
            <input type="password" id="passwordConfirm" name="passwordConfirm" required>
            <div id="password-feedback" class="error"></div>
        </div>
        <div class="form-group">
            <input type="checkbox" id="agreement" name="agreement" required>
            <label for="agreement">I agree to the terms and conditions.</label>
        </div>
        <button type="submit">Register</button>
    </form>

    <script>
        const usernameInput = document.getElementById('username');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const passwordConfirmInput = document.getElementById('passwordConfirm');
        const form = document.getElementById('registerForm');

        let isUsernameDuplicate = true;
        let isEmailDuplicate = true;

        usernameInput.addEventListener('blur', async () => {
            const username = usernameInput.value;
            const feedback = document.getElementById('username-feedback');
            if (username.length > 0) {
                const response = await fetch(`/api/members/check-username?username=${username}`);
                const data = await response.json();
                isUsernameDuplicate = data.isDuplicate;
                feedback.textContent = isUsernameDuplicate ? 'This username is already taken.' : '';
            }
        });

        emailInput.addEventListener('blur', async () => {
            const email = emailInput.value;
            const feedback = document.getElementById('email-feedback');
            if (email.length > 0) {
                const response = await fetch(`/api/members/check-email?email=${email}`);
                const data = await response.json();
                isEmailDuplicate = data.isDuplicate;
                feedback.textContent = isEmailDuplicate ? 'This email is already in use.' : '';
            }
        });

        passwordConfirmInput.addEventListener('keyup', () => {
            const feedback = document.getElementById('password-feedback');
            if (passwordInput.value !== passwordConfirmInput.value) {
                feedback.textContent = 'Passwords do not match.';
            } else {
                feedback.textContent = '';
            }
        });

        form.addEventListener('submit', (e) => {
            if (isUsernameDuplicate || isEmailDuplicate || (passwordInput.value !== passwordConfirmInput.value)) {
                e.preventDefault();
                alert('Please correct the errors before submitting.');
            }
        });
    </script>
</body>
</html>
