<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Post Form</title>
</head>
<body>
    <!-- The title will change depending on whether we are creating or editing -->
    <h1 th:text="${post == null} ? 'Create New Post' : 'Edit Post'">Create/Edit Post</h1>

    <!-- The form's action and object will be dynamic -->
    <form th:action="${post == null} ? @{/posts/new} : @{/posts/{id}/edit(id=${post.id})}"
          th:object="${post == null} ? ${postCreateRequestDto} : ${postUpdateRequestDto}"
          method="post">

        <div>
            <label for="title">Title</label>
            <input type="text" id="title" th:field="*{title}" required>
        </div>
        <div>
            <label for="content">Content</label>
            <textarea id="content" th:field="*{content}" rows="10" cols="50" required></textarea>
        </div>
        <button type="submit">Submit</button>
    </form>
    <br/>
    <a th:href="@{/posts}">Cancel</a>
</body>
</html>
