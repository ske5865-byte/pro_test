<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>All Posts</title>
</head>
<body>
    <h1>Bulletin Board</h1>
    <div sec:authorize="isAuthenticated()">
        <a th:href="@{/posts/new}">Create New Post</a>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit">Log Out</button>
        </form>
    </div>
    <div sec:authorize="isAnonymous()">
        <a th:href="@{/login}">Login to Create a Post</a>
    </div>
    <hr/>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Created At</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="post : ${posts}">
                <td th:text="${post.id}">1</td>
                <td><a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}">Sample Title</a></td>
                <td th:text="${post.author.username}">author</td>
                <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2024-01-01 12:00</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
