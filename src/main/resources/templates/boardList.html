<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Board</title>
    <style>
        body { font-family: sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 50px auto; padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .pagination { text-align: center; margin-top: 20px; }
        .pagination a, .pagination span { margin: 0 5px; text-decoration: none; }
        .pagination .current { font-weight: bold; }
    </style>
</head>
<body>
    <h1>Post List</h1>
    <a th:href="@{/board/write}">Write a new post</a>
    <hr/>
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="post : ${posts}">
                <td th:text="${post.id}">1</td>
                <td><a th:href="@{/board/{id}(id=${post.id})}" th:text="${post.title}">Post Title</a></td>
                <td th:text="${post.author.username}">Author</td>
                <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}">2025-01-01</td>
            </tr>
        </tbody>
    </table>

    <!-- Pagination -->
    <div class="pagination" th:if="${posts.totalPages > 1}">
        <a th:if="${posts.hasPrevious()}" th:href="@{/board/list(page=${posts.number-1})}">Previous</a>
        <span th:each="i : ${#numbers.sequence(0, posts.totalPages - 1)}">
            <a th:href="@{/board/list(page=${i})}" th:text="${i + 1}" th:classappend="${posts.number == i} ? 'current'">1</a>
        </span>
        <a th:if="${posts.hasNext()}" th:href="@{/board/list(page=${posts.number+1})}">Next</a>
    </div>

</body>
</html>
